<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Monitoring - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="login-topbar">
    <span class="logo-small" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="7" width="10" height="10" rx="1"></rect>
        <path d="M9 2v5M15 2v5M9 17v5M15 17v5M2 9h5M2 15h5M17 9h5M17 15h5"></path>
        <path d="M10 10h4v4h-4z"></path>
      </svg>
    </span>
    <span>IOT MONITORING SYSTEM</span>
  </header>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="7" width="10" height="10" rx="1"></rect>
          <path d="M9 2v5M15 2v5M9 17v5M15 17v5M2 9h5M2 15h5M17 9h5M17 15h5"></path>
          <path d="M10 10h4v4h-4z"></path>
        </svg>
      </div>
      <h1 class="login-title">IOT MONITORING SYSTEM</h1>
      <div class="login-subtitle">Environmental Monitoring &amp; Device Control</div>
      <div class="hr"></div>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
              </svg>
            </span>
            <input id="username" type="text" placeholder="Enter username" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>
            <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
            <button type="button" class="suffix" id="togglePassword" title="Show password" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18.1 18.1 0 0 1-3.2 4.2"></path>
                <path d="M6.2 6.2C3.7 8.1 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 3.2-.5"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <button class="login-btn" type="submit">LOGIN</button>
        <div class="login-msg" id="loginMsg"></div>
      </form>
      <div class="ready-row"><span class="dot"></span>Sign in to continue</div>
    </section>
    <div class="login-footer">IoT Monitoring System © 2026</div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
