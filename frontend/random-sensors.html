<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Monitoring - Random Sensors</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/random-sensors.css">
</head>
<body><div class="app-shell random-shell">
<aside class="sidebar">
  <div class="brand-icon" aria-hidden="true"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1"></rect><path d="M9 2v5M15 2v5M9 17v5M15 17v5M2 9h5M2 15h5M17 9h5M17 15h5"></path><path d="M10 10h4v4h-4z"></path></svg></div>
  <div class="brand-title">IOT MONITORING</div>
  <div class="brand-sub">CONTROL CENTER</div>
  <div class="side-sep"></div>
  <nav class="nav">
    <a href="dashboard.html" data-page="dashboard"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></span><span>Dashboard</span></a>
    <a href="random-sensors.html" data-page="random"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg></span><span>Random Sensors</span></a>
    <a href="sensor-data.html" data-page="sensor"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path><circle cx="12" cy="10.5" r="2.5"></circle></svg></span><span>Sensor Data</span></a>
    <a href="device-history.html" data-page="history"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5M12 7v5l3 2"></path></svg></span><span>Device History</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><span>Profile</span></a>
  </nav>
  <div class="sidebar-bottom">
    <div class="side-sep"></div>
    <div class="online"><span class="dot"></span>System Online</div>
    <button class="logout" onclick="logout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path></svg><span>Logout</span></button>
  </div>
</aside>
<main class="main random-main">
  <div class="page-head">
    <div><h1>Random Sensors</h1><div class="page-sub">ESP8266 readings every 2 seconds &middot; Warnings above 50%</div></div>
    <div id="randomConnection" class="random-connection" role="status">OFFLINE</div>
  </div>
  <section id="randomCards" class="random-grid" aria-label="Current random sensor readings"></section>
  <section class="card random-chart" aria-labelledby="randomChartTitle">
    <h2 id="randomChartTitle" class="card-title">Random Sensor Trend</h2>
    <div class="random-chart-wrap"><canvas id="randomChart" role="img" aria-label="Sensor 4, 5 and 6 as percentages of their maximum values"></canvas></div>
    <p id="randomError" class="random-error" role="status"></p>
  </section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="js/common.js"></script>
<script src="js/random-sensors.js"></script>
</body></html>
